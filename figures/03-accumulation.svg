<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Average of averages versus per-token mean</title>
  <rect x="1" y="1" width="958" height="398" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">Who gets a vote: micro-batches or tokens?</text>
  <text x="32" y="68" font-size="14" fill="#64748B">Lecture example: three micro-batches with 4, 4 and 2 real tokens. Each square is one token's loss.</text>

  <g transform="translate(32,96)" font-size="13" font-family="ui-monospace, Menlo, monospace">
    <text x="0" y="16" fill="#334155" font-family="Inter, sans-serif" font-weight="600">mb 1</text>
    <g transform="translate(56,0)"><rect width="34" height="26" rx="5" fill="#818CF8"/><rect x="38" width="34" height="26" rx="5" fill="#818CF8"/><rect x="76" width="34" height="26" rx="5" fill="#818CF8"/><rect x="114" width="34" height="26" rx="5" fill="#818CF8"/><rect x="152" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="190" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/></g>
    <text x="300" y="18" fill="#0F172A">mean 2.0</text>
    <text x="0" y="58" fill="#334155" font-family="Inter, sans-serif" font-weight="600">mb 2</text>
    <g transform="translate(56,42)"><rect width="34" height="26" rx="5" fill="#818CF8"/><rect x="38" width="34" height="26" rx="5" fill="#818CF8"/><rect x="76" width="34" height="26" rx="5" fill="#818CF8"/><rect x="114" width="34" height="26" rx="5" fill="#818CF8"/><rect x="152" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="190" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/></g>
    <text x="300" y="60" fill="#0F172A">mean 2.0</text>
    <text x="0" y="100" fill="#334155" font-family="Inter, sans-serif" font-weight="600">mb 3</text>
    <g transform="translate(56,84)"><rect width="34" height="26" rx="5" fill="#F43F5E"/><rect x="38" width="34" height="26" rx="5" fill="#F43F5E"/><rect x="76" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="114" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="152" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/><rect x="190" width="34" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3 3"/></g>
    <text x="300" y="102" fill="#BE123C">mean 5.0</text>
    <text x="56" y="140" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">dashed = padding, masked out of the loss</text>
  </g>

  <!-- wrong -->
  <g transform="translate(432,96)">
    <rect width="496" height="104" rx="14" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#BE123C">✗ average of averages (pre-2024 frameworks)</text>
    <text x="20" y="60" font-size="15" fill="#0F172A" font-family="ui-monospace, Menlo, monospace">(2.0 + 2.0 + 5.0) / 3 = 3.000</text>
    <text x="20" y="86" font-size="13" fill="#9F1239">each micro-batch gets 1/3 of the vote → mb 3's tokens count 2× each</text>
  </g>
  <!-- right -->
  <g transform="translate(432,212)">
    <rect width="496" height="104" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#0F766E">✓ sum of token losses / total tokens</text>
    <text x="20" y="60" font-size="15" fill="#0F172A" font-family="ui-monospace, Menlo, monospace">(4·2.0 + 4·2.0 + 2·5.0) / 10 = 2.600</text>
    <text x="20" y="86" font-size="13" fill="#115E59">each token gets 1/10 of the vote, whichever micro-batch it landed in</text>
  </g>

  <g transform="translate(32,264)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0F172A">The fix in code</text>
    <text x="0" y="26" font-size="13" fill="#334155" font-family="ui-monospace, Menlo, monospace">n = Σ valid tokens over ALL micro-batches</text>
    <text x="0" y="48" font-size="13" fill="#334155" font-family="ui-monospace, Menlo, monospace">loss_i = CE(..., reduction='sum') / n</text>
    <text x="0" y="70" font-size="13" fill="#334155" font-family="ui-monospace, Menlo, monospace">loss_i.backward()   # grads add up</text>
  </g>
  <text x="432" y="350" font-size="14" fill="#0F172A"><tspan font-weight="700" fill="#BE123C">+15.4%</tspan> wrong here, and exactly <tspan font-weight="700">0%</tspan> wrong whenever token counts are equal,</text>
  <text x="432" y="372" font-size="14" fill="#0F172A">which is why casual tests never caught it.</text>
</svg>
