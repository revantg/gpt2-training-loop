<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Two ways to get one gradient</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">Two roads to the same number</text>
  <text x="32" y="68" font-size="14" fill="#64748B">Autograd multiplies local slopes backwards. The nudge just asks the loss. If they disagree, the graph is lying.</text>

  <!-- left: chain -->
  <g transform="translate(32,96)">
    <rect width="440" height="236" rx="14" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#BE123C">backward(): chain rule, loss → weight</text>
    <g font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0F172A">
      <rect x="20" y="58" width="74" height="40" rx="8" fill="#FFFFFF" stroke="#FDA4AF"/><text x="57" y="83" text-anchor="middle">w</text>
      <rect x="122" y="58" width="74" height="40" rx="8" fill="#FFFFFF" stroke="#FDA4AF"/><text x="159" y="83" text-anchor="middle">h</text>
      <rect x="224" y="58" width="74" height="40" rx="8" fill="#FFFFFF" stroke="#FDA4AF"/><text x="261" y="83" text-anchor="middle">logits</text>
      <rect x="326" y="58" width="94" height="40" rx="8" fill="#E11D48"/><text x="373" y="83" text-anchor="middle" fill="#FFF">loss</text>
    </g>
    <g stroke="#E11D48" stroke-width="2" marker-end="url(#r)">
      <path d="M326,118 L298,118"/><path d="M224,118 L196,118"/><path d="M122,118 L94,118"/>
    </g>
    <g font-size="12" fill="#9F1239" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
      <text x="312" y="140">∂L/∂z</text><text x="210" y="140">× ∂z/∂h</text><text x="108" y="140">× ∂h/∂w</text>
    </g>
    <text x="20" y="182" font-size="13" fill="#334155">One pass gives all 30M gradients at once.</text>
    <text x="20" y="204" font-size="13" fill="#334155">Cost: about 2× a forward pass, for every weight.</text>
  </g>

  <!-- right: nudge -->
  <g transform="translate(496,96)">
    <rect width="432" height="236" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="20" y="30" font-size="15" font-weight="700" fill="#4338CA">the nudge: central difference</text>
    <line x1="40" y1="190" x2="250" y2="190" stroke="#94A3B8"/><line x1="40" y1="190" x2="40" y2="50" stroke="#94A3B8"/>
    <path d="M50,170 C100,160 150,120 240,62" fill="none" stroke="#0F172A" stroke-width="2.4"/>
    <circle cx="105" cy="154" r="5" fill="#4F46E5"/><circle cx="185" cy="104" r="5" fill="#4F46E5"/>
    <line x1="85" y1="166" x2="205" y2="92" stroke="#4F46E5" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="96" y="208" font-size="12" fill="#4338CA" font-family="ui-monospace, Menlo, monospace">w−ε</text>
    <text x="176" y="208" font-size="12" fill="#4338CA" font-family="ui-monospace, Menlo, monospace">w+ε</text>
    <text x="270" y="86" font-size="15" fill="#0F172A" font-family="ui-monospace, Menlo, monospace">L(w+ε) − L(w−ε)</text>
    <line x1="270" y1="96" x2="412" y2="96" stroke="#0F172A"/>
    <text x="341" y="118" font-size="15" fill="#0F172A" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2ε</text>
    <text x="270" y="152" font-size="12" fill="#334155">error ∝ ε², not ε</text>
    <text x="270" y="172" font-size="12" fill="#334155">run in float64, no dropout,</text>
    <text x="270" y="192" font-size="12" fill="#334155">same batch both times</text>
  </g>
</svg>
