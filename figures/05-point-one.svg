<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>0.1 in fp32, bf16 and fp8 E4M3</title>
  <rect x="1" y="1" width="958" height="518" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0F172A">0.1 is not a number a computer can hold</text>
  <text x="32" y="68" font-size="14" fill="#64748B">0.1 = 1.6 × 2⁻⁴, and 0.6 in binary is 0.1001 1001 1001 … forever. Each format keeps a different number of those digits.</text>
  <g font-size="12" font-weight="600">
    <rect x="620" y="84" width="14" height="14" rx="3" fill="#94A3B8"/><text x="640" y="96" fill="#334155">sign</text>
    <rect x="690" y="84" width="14" height="14" rx="3" fill="#4F46E5"/><text x="710" y="96" fill="#334155">exponent (range)</text>
    <rect x="822" y="84" width="14" height="14" rx="3" fill="#0D9488"/><text x="842" y="96" fill="#334155">mantissa (detail)</text>
  </g>

  <!-- fp32 row: 32 cells of 22 -->
  <g transform="translate(32,118)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">fp32</text>
    <text x="56" y="0" font-size="13" fill="#64748B">1 + 8 + 23 bits   ·   0x3DCCCCCD</text>
    <g transform="translate(0,12)" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="0" width="24" height="32" rx="4" fill="#94A3B8"/><text x="12" y="21">0</text>
      <g fill="#4F46E5"><rect x="28" width="24" height="32" rx="4"/><rect x="54" width="24" height="32" rx="4"/><rect x="80" width="24" height="32" rx="4"/><rect x="106" width="24" height="32" rx="4"/><rect x="132" width="24" height="32" rx="4"/><rect x="158" width="24" height="32" rx="4"/><rect x="184" width="24" height="32" rx="4"/><rect x="210" width="24" height="32" rx="4"/></g>
      <text x="40" y="21">0</text><text x="66" y="21">1</text><text x="92" y="21">1</text><text x="118" y="21">1</text><text x="144" y="21">1</text><text x="170" y="21">0</text><text x="196" y="21">1</text><text x="222" y="21">1</text>
      <g fill="#0D9488">
        <rect x="240" width="24" height="32" rx="4"/><rect x="266" width="24" height="32" rx="4"/><rect x="292" width="24" height="32" rx="4"/><rect x="318" width="24" height="32" rx="4"/><rect x="344" width="24" height="32" rx="4"/><rect x="370" width="24" height="32" rx="4"/><rect x="396" width="24" height="32" rx="4"/><rect x="422" width="24" height="32" rx="4"/><rect x="448" width="24" height="32" rx="4"/><rect x="474" width="24" height="32" rx="4"/><rect x="500" width="24" height="32" rx="4"/><rect x="526" width="24" height="32" rx="4"/><rect x="552" width="24" height="32" rx="4"/><rect x="578" width="24" height="32" rx="4"/><rect x="604" width="24" height="32" rx="4"/><rect x="630" width="24" height="32" rx="4"/><rect x="656" width="24" height="32" rx="4"/><rect x="682" width="24" height="32" rx="4"/><rect x="708" width="24" height="32" rx="4"/><rect x="734" width="24" height="32" rx="4"/><rect x="760" width="24" height="32" rx="4"/><rect x="786" width="24" height="32" rx="4"/><rect x="812" width="24" height="32" rx="4" fill="#F59E0B"/>
      </g>
      <text x="252" y="21">1</text><text x="278" y="21">0</text><text x="304" y="21">0</text><text x="330" y="21">1</text><text x="356" y="21">1</text><text x="382" y="21">0</text><text x="408" y="21">0</text><text x="434" y="21">1</text><text x="460" y="21">1</text><text x="486" y="21">0</text><text x="512" y="21">0</text><text x="538" y="21">1</text><text x="564" y="21">1</text><text x="590" y="21">0</text><text x="616" y="21">0</text><text x="642" y="21">1</text><text x="668" y="21">1</text><text x="694" y="21">0</text><text x="720" y="21">0</text><text x="746" y="21">1</text><text x="772" y="21">1</text><text x="798" y="21">0</text><text x="824" y="21">1</text>
    </g>
    <text x="0" y="70" font-size="13" fill="#334155">exponent 01111011 = 123 → 123 − 127 = −4.   mantissa 1.10011001100110011001101₂ = 1.60000002384</text>
    <text x="0" y="90" font-size="13" fill="#0F172A">value <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700">0.100000001490116</tspan>   error <tspan fill="#0D9488" font-weight="700">1.5×10⁻⁹ (0.0000015%)</tspan>   <tspan fill="#B45309">amber bit: …1100 rounded up to …1101</tspan></text>
  </g>

  <!-- bf16 row -->
  <g transform="translate(32,246)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">bf16</text>
    <text x="56" y="0" font-size="13" fill="#64748B">1 + 8 + 7 bits   ·   0x3DCD   ·   literally the top 16 bits of fp32, rounded</text>
    <g transform="translate(0,12)" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="0" width="24" height="32" rx="4" fill="#94A3B8"/><text x="12" y="21">0</text>
      <g fill="#4F46E5"><rect x="28" width="24" height="32" rx="4"/><rect x="54" width="24" height="32" rx="4"/><rect x="80" width="24" height="32" rx="4"/><rect x="106" width="24" height="32" rx="4"/><rect x="132" width="24" height="32" rx="4"/><rect x="158" width="24" height="32" rx="4"/><rect x="184" width="24" height="32" rx="4"/><rect x="210" width="24" height="32" rx="4"/></g>
      <text x="40" y="21">0</text><text x="66" y="21">1</text><text x="92" y="21">1</text><text x="118" y="21">1</text><text x="144" y="21">1</text><text x="170" y="21">0</text><text x="196" y="21">1</text><text x="222" y="21">1</text>
      <g fill="#0D9488"><rect x="240" width="24" height="32" rx="4"/><rect x="266" width="24" height="32" rx="4"/><rect x="292" width="24" height="32" rx="4"/><rect x="318" width="24" height="32" rx="4"/><rect x="344" width="24" height="32" rx="4"/><rect x="370" width="24" height="32" rx="4"/><rect x="396" width="24" height="32" rx="4" fill="#F59E0B"/></g>
      <text x="252" y="21">1</text><text x="278" y="21">0</text><text x="304" y="21">0</text><text x="330" y="21">1</text><text x="356" y="21">1</text><text x="382" y="21">0</text><text x="408" y="21">1</text>
    </g>
    <g transform="translate(432,12)" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#CBD5E1" text-anchor="middle">
      <rect x="0" width="404" height="32" rx="4" fill="none" stroke="#CBD5E1" stroke-dasharray="4 4"/>
      <text x="202" y="21" font-family="Inter, sans-serif" font-size="11.5" fill="#94A3B8">dropped 16 bits 11001100 11001101 → first is 1, so round up</text>
    </g>
    <text x="0" y="70" font-size="13" fill="#334155">same exponent, −4.   mantissa 1.1001101₂ = 1 + 77/128 = 1.6015625</text>
    <text x="0" y="90" font-size="13" fill="#0F172A">value <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700">0.10009765625</tspan>   error <tspan fill="#B45309" font-weight="700">9.8×10⁻⁵ (0.098%)</tspan>   same range as fp32, 2.4 digits</text>
  </g>

  <!-- e4m3 row -->
  <g transform="translate(32,374)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">fp8 E4M3</text>
    <text x="92" y="0" font-size="13" fill="#64748B">1 + 4 + 3 bits   ·   0x1D   ·   bias 7, max 448, no ∞</text>
    <g transform="translate(0,12)" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="0" width="24" height="32" rx="4" fill="#94A3B8"/><text x="12" y="21">0</text>
      <g fill="#4F46E5"><rect x="28" width="24" height="32" rx="4"/><rect x="54" width="24" height="32" rx="4"/><rect x="80" width="24" height="32" rx="4"/><rect x="106" width="24" height="32" rx="4"/></g>
      <text x="40" y="21">0</text><text x="66" y="21">0</text><text x="92" y="21">1</text><text x="118" y="21">1</text>
      <g fill="#0D9488"><rect x="136" width="24" height="32" rx="4"/><rect x="162" width="24" height="32" rx="4"/><rect x="188" width="24" height="32" rx="4" fill="#F59E0B"/></g>
      <text x="148" y="21">1</text><text x="174" y="21">0</text><text x="200" y="21">1</text>
    </g>
    <!-- number line of neighbours -->
    <g transform="translate(250,12)" font-size="11" font-family="ui-monospace, Menlo, monospace">
      <line x1="0" y1="16" x2="580" y2="16" stroke="#CBD5E1" stroke-width="2"/>
      <g fill="#0D9488"><circle cx="20" cy="16" r="5"/><circle cx="160" cy="16" r="5"/><circle cx="300" cy="16" r="7" fill="#F59E0B"/><circle cx="440" cy="16" r="5"/><circle cx="580" cy="16" r="5"/></g>
      <text x="20" y="42" text-anchor="middle" fill="#64748B">0.0859</text><text x="160" y="42" text-anchor="middle" fill="#64748B">0.09375</text><text x="300" y="42" text-anchor="middle" fill="#B45309" font-weight="700">0.1015625</text><text x="440" y="42" text-anchor="middle" fill="#64748B">0.1094</text><text x="580" y="42" text-anchor="middle" fill="#64748B">0.1172</text>
      <line x1="270" y1="2" x2="270" y2="30" stroke="#E11D48" stroke-width="2"/><text x="270" y="0" text-anchor="middle" fill="#E11D48" font-weight="700">0.1</text>
    </g>
    <text x="0" y="70" font-size="13" fill="#334155">exponent 0011 = 3 → 3 − 7 = −4.   mantissa 1.101₂ = 1.625. Only 8 values live between 0.0625 and 0.125.</text>
    <text x="0" y="90" font-size="13" fill="#0F172A">value <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700">0.1015625</tspan>   error <tspan fill="#E11D48" font-weight="700">1.6×10⁻³ (1.56%)</tspan>   0.1 sits 0.0016 from one neighbour, 0.0063 from the other</text>
  </g>
</svg>
